<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><title>Выбор инструментов для командной работы</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Manrope:wght@400;600;800&display=swap&subset=cyrillic" rel="stylesheet">
<style>
:root{--bg:#0a0203;--r1:#ff2a3d;--r2:#b3001b;--r3:#6b0010;--r4:#2a0409;--tx:#ffe9ea;--mu:#c9959a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;font-family:Manrope,system-ui,sans-serif;color:var(--tx)}
#fx{position:fixed;inset:0;width:100%;height:100%}
#st{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:0 0}
.s{position:absolute;inset:0;padding:56px 72px;opacity:0;pointer-events:none;transition:opacity .5s;display:flex;flex-direction:column}
.s.on{opacity:1;pointer-events:auto}
.r{opacity:0;transform:translateY(34px) scale(.97);filter:blur(8px)}
.on .r{animation:up .8s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i,0)*.11s + .1s)}
@keyframes up{to{opacity:1;transform:none;filter:none}}
.k{font:800 13px Unbounded;letter-spacing:.35em;color:var(--r1);text-shadow:0 0 18px var(--r1)}
h1,h2{font-family:Unbounded;margin:.2em 0 .3em;line-height:1.1}
h2{font-size:42px;font-weight:800;background:linear-gradient(90deg,#fff,#ff6a78 45%,#b3001b);-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200%;animation:sh 5s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
h1{font-size:68px;font-weight:800;background:linear-gradient(100deg,#fff 10%,#ff2a3d 50%,#fff 90%);background-size:250%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 6s linear infinite;filter:drop-shadow(0 0 30px #ff2a3d66)}
p{color:var(--mu);font-size:20px;line-height:1.5;margin:.3em 0}
.card{background:linear-gradient(145deg,#3a0610cc,#1a0307cc);border:1px solid #ff2a3d44;border-radius:20px;padding:24px 28px;backdrop-filter:blur(6px);box-shadow:0 20px 50px #0009,inset 0 0 40px #ff2a3d12;transition:transform .3s,box-shadow .3s,border-color .3s}
.card:hover{transform:translateY(-8px) rotateX(4deg);border-color:var(--r1);box-shadow:0 24px 60px #ff2a3d44}
.card h3{font:800 22px Unbounded;margin:0 0 10px;color:#fff}
.g{display:grid;gap:22px}.c2{grid-template-columns:1fr 1fr}.c4{grid-template-columns:repeat(4,1fr)}.c3{grid-template-columns:repeat(3,1fr)}
li{font-size:19px;line-height:1.7;color:#f3cfd2;list-style:none;padding-left:26px;position:relative}ul{margin:0;padding:0}
li:before{content:"▸";position:absolute;left:0;color:var(--r1)}
.bad li:before{content:"✕";font-size:14px}
.foot{margin-top:auto;display:flex;justify-content:space-between;font-size:13px;color:#8a4a50}
.chip{display:inline-block;padding:12px 28px;border:1px solid var(--r1);border-radius:99px;font:800 20px Unbounded;margin:6px;animation:fl 3s ease-in-out infinite;box-shadow:0 0 24px #ff2a3d55;background:#2a040988}
.chip:nth-child(2){animation-delay:-.7s}.chip:nth-child(3){animation-delay:-1.4s}.chip:nth-child(4){animation-delay:-2.1s}
@keyframes fl{50%{transform:translateY(-14px);box-shadow:0 0 44px #ff2a3daa}}
.kb{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.kb div{background:#00000055;border-radius:10px;padding:8px;min-height:90px;font-size:12px;color:var(--mu)}
.kb b{display:block;background:linear-gradient(90deg,#ff2a3d,#b3001b);height:22px;border-radius:5px;margin-top:6px}
.mv{animation:mv 4s ease-in-out infinite}@keyframes mv{0%,15%{transform:translateX(0)}45%,60%{transform:translateX(calc(100% + 18px))}90%,100%{transform:translateX(calc(200% + 36px))}}
table{border-collapse:separate;border-spacing:0 6px;width:100%;font-size:18px}
td,th{padding:10px 16px;text-align:left}th{color:var(--r1);font:800 13px Unbounded;letter-spacing:.1em}
tbody td{background:#2a0409aa}tbody td:first-child{border-radius:12px 0 0 12px;font-weight:800}tbody td:last-child{border-radius:0 12px 12px 0}
tr.r.hl td{box-shadow:inset 0 0 0 0}
td.j{background:linear-gradient(90deg,#b3001b,#6b0010)!important;color:#fff;font-weight:800;animation:gl 2.4s ease-in-out infinite}
@keyframes gl{50%{box-shadow:0 0 22px #ff2a3d}}
.img{border-radius:16px;border:1px solid var(--r1);box-shadow:0 0 50px #ff2a3d55;width:100%;animation:fl 5s ease-in-out infinite}
.bar{height:34px;border-radius:99px;background:#2a0409;overflow:hidden;margin:6px 0 20px}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#6b0010,#ff2a3d);box-shadow:0 0 20px #ff2a3d}
.on .bar i{animation:bw 1.6s .6s cubic-bezier(.2,.8,.2,1) forwards}@keyframes bw{to{width:var(--w)}}
.num{font:800 34px Unbounded;color:var(--r1);text-shadow:0 0 18px var(--r1);margin-right:18px;min-width:56px;display:inline-block}
.big{font:800 190px Unbounded;line-height:1;color:transparent;-webkit-text-stroke:3px var(--r1);filter:drop-shadow(0 0 30px #ff2a3d);animation:pu 2.5s ease-in-out infinite}
@keyframes pu{50%{filter:drop-shadow(0 0 70px #ff2a3d);transform:scale(1.04)}}
.row{display:flex;align-items:center;padding:12px 0;border-bottom:1px solid #ff2a3d33;font-size:21px}
#ui{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:14px;z-index:5}
#ui button{background:#2a0409cc;color:#fff;border:1px solid var(--r1);border-radius:99px;width:44px;height:44px;font-size:18px;cursor:pointer}
#ui button:hover{background:var(--r2)}
#pg{position:fixed;top:0;left:0;height:4px;background:linear-gradient(90deg,var(--r2),var(--r1));box-shadow:0 0 14px var(--r1);transition:width .5s;z-index:5}
</style></head><body>
<canvas id="fx"></canvas><div id="pg"></div><div id="st"></div>
<div id="ui"><button id="pv">←</button><button id="nx">→</button></div>
